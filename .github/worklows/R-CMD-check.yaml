# Flujo de integración continua para el paquete deor.
# Derivado de los ejemplos de https://github.com/r-lib/actions (rama v2).
# Corre R CMD check en Ubuntu, instalando antes los binarios de sistema y los
# helpers de Python que algunas funciones de deor necesitan.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gnupg tar qpdf \
            libreoffice \
            poppler-utils libpoppler-cpp-dev \
            imagemagick libmagick++-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar helpers de Python (py7zr, pyzipper)
        run: python -m pip install --upgrade pip py7zr pyzipper

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
